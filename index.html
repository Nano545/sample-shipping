<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Request Manager</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Vue.js 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Inter', sans-serif;
    }

    /* Print Styles */
    @media print {
        .no-print {
            display: none !important;
        }

        .print-only {
            display: block !important;
        }

        body {
            background: white;
            color: black;
        }

        .print-page-break {
            page-break-before: always;
        }

        /* Reset Kanban layout for print to list */
        .kanban-board {
            display: block;
        }

        .kanban-card {
            border: 1px solid #ccc;
            margin-bottom: 20px;
            break-inside: avoid;
        }
    }

    @media screen {
        .print-only {
            display: none !important;
        }
    }

    /* Custom Scrollbar for Kanban columns */
    .scroller::-webkit-scrollbar {
        width: 6px;
    }

    .scroller::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    .scroller::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
    }
</style>
<script>
    // --- CONFIGURATION ---
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbysGWGp3gKKdiT46ONGkhPzJ595ZqSg2sUVmpNbD-76alLhbikUHGZ0ttEaKKTmOJBC/exec';

    // --- CONSTANTS ---
    const SAMPLE_PRODUCTS = [
        { jan: '4901234567890', name: 'プレミアム緑茶 500ml', tempQty: 1 },
        { jan: '4901234567891', name: '香ばし玄米茶 500ml', tempQty: 1 },
        { jan: '4901234567892', name: '特選ジャスミン茶 500ml', tempQty: 1 },
        { jan: '4901234567893', name: '濃厚ブラックコーヒー 280ml', tempQty: 1 },
        { jan: '4901234567894', name: '微糖カフェオレ 280ml', tempQty: 1 },
        { jan: '4501234567800', name: 'リフレッシュ・レモン 500ml', tempQty: 1 },
    ];

    const REQUESTER_LIST = ['東方', '山本', '竹田', '小川', '岡本'];

    // --- GLOBAL ERROR HANDLER ---
    window.onerror = function (msg, url, lineNo, columnNo, error) {
        console.error('Global Error:', msg, url, lineNo, error);
        const errorDiv = document.getElementById('error-display') || document.createElement('div');
        errorDiv.id = 'error-display';
        errorDiv.style.position = 'fixed';
        errorDiv.style.bottom = '0';
        errorDiv.style.left = '0';
        errorDiv.style.right = '0';
        errorDiv.style.backgroundColor = 'red';
        errorDiv.style.color = 'white';
        errorDiv.style.padding = '10px';
        errorDiv.style.zIndex = '9999';
        errorDiv.innerHTML = `<strong>Error:</strong> ${msg} (Line: ${lineNo})`;
        document.body.appendChild(errorDiv);
        return false;
    };

    // --- UTILS OBJECT ---
    const AppUtils = {
        formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('ja-JP');
        },
        getUrgencyClass(targetDateStr) {
            const today = new Date().toISOString().split('T')[0];
            if (!targetDateStr) return '';
            if (targetDateStr < today) return 'border-l-red-500 bg-red-50'; // Overdue
            if (targetDateStr === today) return 'border-l-orange-400 bg-orange-50'; // Today
            return 'border-l-green-400'; // Future
        },
        // Helper to pick a random product for demo
        pickRandomProduct(detailsFrom) {
            const list = detailsFrom || SAMPLE_PRODUCTS;
            const p = list[Math.floor(Math.random() * list.length)];
            return { jan: p.jan, name: p.name, qty: Math.floor(Math.random() * 5) + 1 };
        },
        // Address Search Proxy
        // Address Search (Direct Browser Fetch to avoid GAS IP blocking)
        async searchAddress(zip) {
            // Using zipcloud API directly
            const url = `https://zipcloud.ibsnet.co.jp/api/search?zipcode=${zip}`;
            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.status === 200 && data.results) {
                    const r = data.results[0];
                    return {
                        status: 'success',
                        found: true,
                        address: `${r.address1}${r.address2}${r.address3}`,
                        details: r
                    };
                } else if (data.status === 200 && !data.results) {
                    return { status: 'success', found: false };
                } else {
                    return { status: 'error', message: `API Status: ${data.status} - ${data.message || ''}` };
                }
            } catch (e) {
                console.error('Address Search Error:', e);
                return { status: 'error', message: e.toString() };
            }
        }
    };
</script>
<!DOCTYPE html>
<html lang="ja">

<head>
    <?!= include('_styles'); ?>
</head>

<body class="bg-gray-50 text-gray-800">
    <div id="requester-app" class="min-h-screen flex flex-col">

        <!-- Header (Blue Theme for Requester) -->
        <header class="bg-indigo-600 shadow-lg sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center text-white">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                    SampleRequest <span class="text-sm font-normal opacity-80 ml-2">| 注文フォーム</span>
                </h1>
                <div class="text-xs font-medium opacity-80 hidden sm:block">
                    {{ gasApiUrl ? 'Connected' : 'Demo Mode' }}
                </div>
            </div>
            <!-- Status Msg -->
            <div v-if="message" role="alert"
                :class="`text-center py-2 text-sm text-white font-bold transition-colors duration-300 ${messageType === 'success' ? 'bg-green-500' : 'bg-red-500'}`">
                {{ message }}
            </div>
        </header>

        <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left: Product Selection -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-500">
                        <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">商品選択</h2>

                        <!-- Search -->
                        <div class="mb-4 flex gap-2">
                            <input type="text" v-model="searchQuery" placeholder="商品名またはJANコードで検索..."
                                class="flex-grow px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-sm">
                            <button v-if="searchQuery" @click="searchQuery = ''"
                                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition font-bold shadow-sm">
                                リセット
                            </button>
                        </div>

                        <!-- Product List -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[600px] overflow-y-auto scroller pr-2">
                            <div v-for="product in filteredProducts" :key="product.jan"
                                class="border border-gray-200 rounded-lg p-4 hover:shadow-lg transition duration-200 bg-white flex flex-col justify-between group">
                                <div>
                                    <div class="text-xs text-gray-400 font-mono mb-1">{{ product.jan }}</div>
                                    <div class="font-bold text-gray-800 mb-2 text-lg">{{ product.name }}</div>
                                </div>
                                <div
                                    class="flex items-center justify-between mt-4 pt-3 border-t border-dashed border-gray-100">
                                    <div class="flex items-center border rounded-md bg-gray-50 overflow-hidden">
                                        <button @click="adjustTempQty(product, -1)"
                                            class="px-3 py-2 text-gray-600 hover:bg-gray-200 active:bg-gray-300 transition">-</button>
                                        <input type="number" v-model.number="product.tempQty" min="1"
                                            class="w-12 text-center text-sm border-none bg-transparent focus:ring-0 font-bold">
                                        <button @click="adjustTempQty(product, 1)"
                                            class="px-3 py-2 text-gray-600 hover:bg-gray-200 active:bg-gray-300 transition">+</button>
                                    </div>
                                    <button @click="addToCart(product)"
                                        class="bg-indigo-600 text-white px-5 py-2 rounded-md text-sm font-bold shadow-md hover:bg-indigo-700 hover:shadow-lg transition transform active:scale-95">
                                        追加
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Cart & Form -->
                <div class="lg:col-span-1 space-y-6">
                    <!-- Cart -->
                    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-400">
                        <h2 class="text-lg font-bold mb-4 text-gray-800 flex justify-between items-center">
                            依頼リスト
                            <span class="bg-indigo-100 text-indigo-800 text-sm px-3 py-1 rounded-full font-bold">{{
                                cartTotalItems }} 点</span>
                        </h2>

                        <div v-if="cart.length === 0"
                            class="text-center py-10 text-gray-400 text-sm bg-gray-50 rounded-lg border-dashed border-2 border-gray-200">
                            商品が選択されていません
                        </div>
                        <ul v-else class="space-y-3 mb-6 max-h-[300px] overflow-y-auto scroller">
                            <li v-for="(item, index) in cart" :key="index"
                                class="flex justify-between items-start text-sm border-b border-gray-100 pb-3 last:border-0 hover:bg-gray-50 p-2 rounded transition">
                                <div class="flex-1">
                                    <div class="font-bold text-gray-700">{{ item.name }}</div>
                                    <div class="text-xs text-gray-400 font-mono">{{ item.jan }}</div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="font-bold text-indigo-600 text-lg">x{{ item.qty }}</span>
                                    <button @click="removeFromCart(index)"
                                        class="text-gray-400 hover:text-red-500 transition p-1" title="削除">
                                        &times;
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </div>

                    <!-- Request Form -->
                    <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-gray-300">
                        <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">送付先情報</h2>
                        <form @submit.prevent="confirmSubmit" class="space-y-5">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">発注担当者名 <span
                                        class="text-red-500">*</span></label>
                                <select v-model="form.requester" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white shadow-sm">
                                    <option value="" disabled>選択してください</option>
                                    <option v-for="name in requesterList" :key="name" :value="name">{{ name }}</option>
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">納品指定日 <span
                                            class="text-red-500">*</span></label>
                                    <input type="date" v-model="form.targetDate" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">配送時間 <span
                                            class="text-red-500">*</span></label>
                                    <select v-model="form.timeSlot" required
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white shadow-sm">
                                        <option value="">指定なし</option>
                                        <option value="AM">午前</option>
                                        <option value="PM">午後</option>
                                    </select>
                                </div>
                            </div>

                            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                                <label class="block text-sm font-bold text-gray-700 mb-3 border-b pb-1">配送先詳細</label>
                                <div class="grid grid-cols-2 gap-3 mb-3">
                                    <div class="col-span-1">
                                        <label class="block text-xs font-semibold text-gray-500 mb-1">郵便番号</label>
                                        <div class="flex flex-col gap-2">
                                            <input type="text" v-model="form.zip" placeholder="1234567" maxlength="8"
                                                class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-sm font-mono">
                                            <div class="flex gap-2 justify-end">
                                                <button type="button" @click="handleAddressSearch"
                                                    :disabled="isSearching"
                                                    class="bg-slate-700 text-white px-3 py-1 rounded text-xs font-bold hover:bg-slate-600 disabled:bg-gray-400 whitespace-nowrap">
                                                    検索
                                                </button>
                                                <button type="button" @click="clearAddress"
                                                    :disabled="!form.zip && !form.addressAuto && !form.addressDetail"
                                                    class="bg-gray-100 text-gray-600 border border-gray-300 px-3 py-1 rounded text-xs font-bold hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                                                    title="郵便番号と住所をクリア">
                                                    クリア
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-span-1">
                                        <label class="block text-xs font-semibold text-gray-500 mb-1">電話番号</label>
                                        <input type="tel" v-model="form.phone" placeholder="090-1234-5678"
                                            class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-sm">
                                    </div>
                                </div>
                                <div class="mb-3 space-y-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-500 mb-1">住所 (自動入力) <span
                                                class="text-red-500">*</span></label>
                                        <input type="text" v-model="form.addressAuto" readonly tabindex="-1"
                                            placeholder="郵便番号から検索ボタンで自動入力"
                                            class="w-full px-3 py-1.5 border border-gray-200 bg-gray-100 text-gray-600 rounded outline-none text-sm cursor-not-allowed">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-500 mb-1">住所 (番地・ビル名など)
                                            <span class="text-red-500">*</span></label>
                                        <input type="text" v-model="form.addressDetail" required
                                            placeholder="番地・ビル名を入力してください"
                                            class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-sm">
                                    </div>
                                </div>
                                <div class="mb-1">
                                    <label class="block text-xs font-semibold text-gray-500 mb-1">宛名（送付先名）<span
                                            class="text-red-500">*</span></label>
                                    <input type="text" v-model="form.targetName" required placeholder="○○工場 御中"
                                        class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-sm">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">備考</label>
                                <textarea v-model="form.remarks" rows="2" placeholder="取扱注意、午前中指定など"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm shadow-sm"></textarea>
                            </div>

                            <button type="submit" :disabled="isSubmitting || cart.length === 0"
                                class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg shadow-md hover:bg-indigo-700 hover:shadow-xl disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed transition transform active:scale-[0.98]">
                                <span v-if="isSubmitting">送信中...</span>
                                <span v-else>依頼を送信する</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Confirmation Modal -->
        <div v-if="showConfirmModal"
            class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-[9999]"
            @click.self="showConfirmModal = false">
            <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all scale-100">
                <h3 class="text-xl font-bold text-gray-900 mb-2">送信確認</h3>
                <p class="text-gray-600 mb-6">この内容で依頼を送信してもよろしいですか？</p>
                <div class="flex gap-4">
                    <button @click="showConfirmModal = false"
                        class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-lg font-bold hover:bg-gray-200 transition">
                        キャンセル
                    </button>
                    <button @click="submitOrder"
                        class="flex-1 py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 shadow-md transition">
                        送信する
                    </button>
                </div>
            </div>
        </div>

    </div>

    <?!= include('_utils'); ?>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    gasApiUrl: GAS_API_URL,
                    products: SAMPLE_PRODUCTS,
                    requesterList: REQUESTER_LIST,

                    searchQuery: '',
                    cart: [],
                    form: {
                        requester: '',
                        zip: '',
                        addressAuto: '',
                        addressDetail: '',
                        targetName: '',
                        phone: '',
                        targetDate: new Date().toISOString().split('T')[0],
                        timeSlot: '',
                        remarks: ''
                    },
                    isSubmitting: false,
                    isSearching: false,
                    message: '',
                    messageType: 'success',
                    showConfirmModal: false // For confirmation
                }
            },
            computed: {
                filteredProducts() {
                    if (!this.searchQuery) return this.products;
                    const q = this.searchQuery.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q) || p.jan.includes(q));
                },
                cartTotalItems() {
                    return this.cart.reduce((sum, item) => sum + item.qty, 0);
                }
            },
            async mounted() {
                await this.fetchProducts();
            },
            methods: {
                async fetchProducts() {
                    if (this.gasApiUrl) {
                        try {
                            const res = await fetch(`${this.gasApiUrl}?action=products`);
                            const data = await res.json();
                            if (data.status !== 'error' && data.products) {
                                this.products = data.products.map(p => ({ ...p, tempQty: 1 }));
                            } else {
                                this.showMessage('デモデータを使用中 (API接続なし/エラー)', 'warning');
                            }
                        } catch (e) {
                            console.warn('API Error, using demo data', e);
                            this.showMessage('通信エラー: デモモードで動作します', 'error');
                        }
                    }
                },
                showMessage(text, type = 'success') {
                    this.message = text;
                    this.messageType = type;
                    setTimeout(() => this.message = '', 3000);
                },
                adjustTempQty(product, delta) {
                    const newQty = (product.tempQty || 1) + delta;
                    if (newQty >= 1) product.tempQty = newQty;
                },
                addToCart(product) {
                    const existing = this.cart.find(item => item.jan === product.jan);
                    if (existing) {
                        existing.qty += product.tempQty;
                    } else {
                        this.cart.push({ jan: product.jan, name: product.name, qty: product.tempQty });
                    }
                    product.tempQty = 1;
                    this.showMessage(`カートに追加: ${product.name}`);
                },
                removeFromCart(index) {
                    this.cart.splice(index, 1);
                },

                // Confirm Dialog Trigger
                confirmSubmit() {
                    if (this.cart.length === 0) return;
                    this.showConfirmModal = true;
                },

                async submitOrder() {
                    this.showConfirmModal = false; // Close modal
                    this.isSubmitting = true;

                    const payload = {
                        action: 'create',
                        requester: this.form.requester,
                        zip: this.form.zip,
                        address: (this.form.addressAuto + this.form.addressDetail).trim(),
                        targetName: this.form.targetName,
                        phone: this.form.phone,
                        targetDate: this.form.targetDate,
                        timeSlot: this.form.timeSlot,
                        remarks: this.form.remarks,
                        items: this.cart
                    };

                    if (this.gasApiUrl) {
                        try {
                            const res = await fetch(this.gasApiUrl, {
                                method: 'POST',
                                redirect: 'follow',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify(payload)
                            });
                            const result = await res.json();
                            if (result.status === 'error') throw new Error(result.message);
                            this.showMessage('注文を送信しました！');
                            this.resetForm();
                        } catch (e) {
                            console.error(e);
                            this.showMessage('送信エラー: ' + e.message, 'error');
                        }
                    } else {
                        // Demo
                        await new Promise(r => setTimeout(r, 800));
                        console.log('Demo Submit:', payload);
                        this.showMessage('デモ注文を送信しました');
                        this.resetForm();
                    }
                    this.isSubmitting = false;
                },
                resetForm() {
                    this.cart = [];
                    this.form.requester = '';
                    this.form.zip = '';
                    this.form.addressAuto = '';
                    this.form.addressDetail = '';
                    this.form.targetName = '';
                    this.form.phone = '';
                    this.form.remarks = '';
                    this.form.targetDate = new Date().toISOString().split('T')[0];
                    this.form.timeSlot = '';
                },
                async handleAddressSearch() {
                    if (!this.form.zip || this.form.zip.length < 3) {
                        this.showMessage('郵便番号を入力してください', 'warning');
                        return;
                    }
                    this.isSearching = true;
                    try {
                        const result = await AppUtils.searchAddress(this.form.zip);
                        if (result.status === 'success') {
                            if (result.found) {
                                this.form.addressAuto = result.address;
                                this.showMessage('住所を検索しました');
                            } else {
                                this.showMessage('該当する住所が見つかりませんでした', 'warning');
                            }
                        } else {
                            this.showMessage(`検索エラー: ${result.message}`, 'error');
                        }
                    } catch (e) {
                        this.showMessage('検索エラー', 'error');
                    }
                    this.isSearching = false;
                },
                clearAddress() {
                    this.form.zip = '';
                    this.form.addressAuto = '';
                    this.form.addressDetail = '';
                    this.showMessage('住所情報をクリアしました');
                }
            }
        }).mount('#requester-app');
    </script>
</body>

</html>
